name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psutil pytest

      - name: Run the test suite
        run: python -m pytest tests -v

      - name: Scan loopback through the CLI
        run: |
          python -m ipscanner.cli --list-fetchers
          python -m ipscanner.cli 127.0.0.1 --all --ping-method tcp -p 22,80,443 --fetchers ip,ping,ports --no-colour
